name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q bats shellcheck jq dnsutils

      - name: Análisis estático (shellcheck)
        run: shellcheck -x -S style scripts/*.sh scripts/lib/comun.sh pruebas/*.sh

      - name: Configuración segura de PicoClaw
        run: python3 -m unittest -v tests/test_picoclaw_endurecer.py

      - name: Instalador y piezas de seguridad (sistema simulado)
        run: sudo -E bats tests/
