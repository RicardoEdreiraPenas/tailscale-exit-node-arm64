name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Herramientas
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bats jq dnsutils
          # La misma versión de shellcheck con la que se desarrolla (la de apt es más antigua).
          python3 -m pip install --user --break-system-packages shellcheck-py==0.11.0.1

      - name: Análisis estático (shellcheck)
        run: shellcheck -x -S style scripts/*.sh scripts/lib/comun.sh pruebas/*.sh

      - name: Configuración segura de PicoClaw
        run: python3 -m unittest -v tests/test_picoclaw_endurecer.py

      - name: Instalador y piezas de seguridad (sistema simulado)
        run: sudo -E bats tests/
